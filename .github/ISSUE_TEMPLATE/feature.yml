name: "功能或改进 / Feature or improvement"
description: "提出新能力、体验或运维改进；被接受不等于获得实施授权。"
title: "[Feature] "
labels:
  - "type:enhancement"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        请先搜索相似 Issue。Issue 只能用于研究与分诊，不能扩大 AGENTS.md 或 TODO.md 的授权范围。
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem to solve"
      description: "描述当前可观察的问题，不要直接指定未经验证的技术方案。"
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: "理想行为 / Desired behavior"
      description: "说明完成后用户能够做什么。"
    validations:
      required: true
  - type: textarea
    id: timing
    attributes:
      label: "为什么现在需要 / Why now"
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: "与已确认边界的关系 / Product-boundary fit"
      options:
        - "符合当前已授权范围 / Within current authorized scope"
        - "可能需要新授权 / May require new authorization"
        - "与当前决定冲突 / Conflicts with a current decision"
        - "尚不确定 / Unsure"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "可观察验收标准 / Observable acceptance criteria"
      placeholder: "- [ ] 可以通过……验证"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives"
      description: "选填。"
  - type: textarea
    id: impacts
    attributes:
      label: "依赖、费用、隐私和迁移影响 / Impacts"
      description: "选填；若未知请明确写未知，不得假定零成本。"
  - type: input
    id: tracking
    attributes:
      label: "相关里程碑或 TODO 编号 / Tracking reference"
      description: "选填，例如 M8F-001。"
  - type: checkboxes
    id: authority_confirmation
    attributes:
      label: "授权确认 / Authorization confirmation"
      options:
        - label: "我理解 Issue 被接受不代表已授权实施、外部写入、付费、部署或公开发布。"
          required: true
