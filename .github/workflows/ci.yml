name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown_structure:
    name: markdown-and-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:markdown
      - run: pnpm check:structure

  registry_consistency:
    name: registry-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:registry

  manifest_schema:
    name: manifest-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:manifest
      - run: pnpm check:contracts

  dependency_resolution:
    name: dependency-resolution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:dependencies

  source_policy:
    name: source-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:sources

  planning_contract:
    name: planning-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:planning

  curriculum_graph:
    name: curriculum-graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:learning-content

  assessment_contract:
    name: assessment-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:assessment

  review_policy:
    name: review-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:review-policy

  mastery_policy:
    name: mastery-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:mastery-policy

  api_tests:
    name: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:api

  web_tests:
    name: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:web

  end_to_end:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm --filter @cloud-study/web exec playwright install --with-deps chromium
      - run: pnpm check:e2e

  contract_drift:
    name: contract-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:contract-drift

  secret_scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-project
      - run: pnpm check:secrets

  release_readiness:
    name: release-readiness
    if: always()
    needs:
      - markdown_structure
      - registry_consistency
      - manifest_schema
      - dependency_resolution
      - source_policy
      - planning_contract
      - curriculum_graph
      - assessment_contract
      - review_policy
      - mastery_policy
      - api_tests
      - web_tests
      - end_to_end
      - contract_drift
      - secret_scan
    runs-on: ubuntu-latest
    steps:
      - name: Require every baseline check
        shell: bash
        run: |
          test "${{ needs.markdown_structure.result }}" = "success"
          test "${{ needs.registry_consistency.result }}" = "success"
          test "${{ needs.manifest_schema.result }}" = "success"
          test "${{ needs.dependency_resolution.result }}" = "success"
          test "${{ needs.source_policy.result }}" = "success"
          test "${{ needs.planning_contract.result }}" = "success"
          test "${{ needs.curriculum_graph.result }}" = "success"
          test "${{ needs.assessment_contract.result }}" = "success"
          test "${{ needs.review_policy.result }}" = "success"
          test "${{ needs.mastery_policy.result }}" = "success"
          test "${{ needs.api_tests.result }}" = "success"
          test "${{ needs.web_tests.result }}" = "success"
          test "${{ needs.end_to_end.result }}" = "success"
          test "${{ needs.contract_drift.result }}" = "success"
          test "${{ needs.secret_scan.result }}" = "success"
