[project]
name = "cloud-study-api"
version = "0.1.0"
description = "Local FastAPI service for the AI skill learning platform."
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "packaging>=25,<26",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.7,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_study_api"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q --basetemp=.pytest-tmp -p no:cacheprovider"
pythonpath = ["../.."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["cloud_study_api"]
mypy_path = "src"

[tool.uv]
required-version = ">=0.11.32,<0.12"
